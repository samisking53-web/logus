# 라이브러리 버전을 한곳에서 관리한다.
# 2024년 말 기준 안정 버전이다. Android Studio가 새 버전을 제안하면 올려도 된다.
[versions]
agp = "8.7.3"
kotlin = "2.1.0"
googleServices = "4.4.2"
coreKtx = "1.15.0"
activityCompose = "1.9.3"
lifecycle = "2.8.7"
composeBom = "2024.12.01"
firebaseBom = "33.7.0"
coroutinesPlayServices = "1.9.0"
credentials = "1.3.0"
googleId = "1.1.1"
coil = "3.0.4"
exifinterface = "1.3.7"
playServicesLocation = "21.3.0"
camerax = "1.4.1"
maplibre = "11.8.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
# 뒤로 가기·› ·+ 같은 기본 아이콘(버전은 compose-bom 이 맞춘다)
androidx-compose-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }

firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom" }
firebase-auth = { group = "com.google.firebase", name = "firebase-auth" }
firebase-firestore = { group = "com.google.firebase", name = "firebase-firestore" }
firebase-storage = { group = "com.google.firebase", name = "firebase-storage" }
# 서버 함수(createJourney 등) 부르기
firebase-functions = { group = "com.google.firebase", name = "firebase-functions" }
kotlinx-coroutines-play-services = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-play-services", version.ref = "coroutinesPlayServices" }

androidx-credentials = { group = "androidx.credentials", name = "credentials", version.ref = "credentials" }
androidx-credentials-play-services-auth = { group = "androidx.credentials", name = "credentials-play-services-auth", version.ref = "credentials" }
googleid = { group = "com.google.android.libraries.identity.googleid", name = "googleid", version.ref = "googleId" }

# 프로필 사진(인터넷 주소)을 화면에 띄우는 라이브러리
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-network-okhttp = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil" }

# 안드로이드 8(API 26·27)에서 사진 방향(EXIF)을 읽어 옆으로 눕지 않게 한다
androidx-exifinterface = { group = "androidx.exifinterface", name = "exifinterface", version.ref = "exifinterface" }

# 현재 위치(대략) 잡기. 새 여정의 도시 추천에 쓴다(구글 장소 데이터는 쓰지 않는다)
play-services-location = { group = "com.google.android.gms", name = "play-services-location", version.ref = "playServicesLocation" }

# S04 앱 내 카메라: 미리보기·영상 녹화(10초 제한)·16:9 잘라 찍기 (안드로이드 공식 카메라 라이브러리)
androidx-camera-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "camerax" }
androidx-camera-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "camerax" }
androidx-camera-video = { group = "androidx.camera", name = "camera-video", version.ref = "camerax" }
androidx-camera-view = { group = "androidx.camera", name = "camera-view", version.ref = "camerax" }

# L01 위치 확인 지도(MapLibre Native Android + OpenFreeMap 타일). 카카오·구글 지도는 쓰지 않는다(CLAUDE.md)
maplibre-android = { group = "org.maplibre.gl", name = "android-sdk", version.ref = "maplibre" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
